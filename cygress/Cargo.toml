[package]
name = "cygress"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.9"
tokio = { workspace = true, features = ["macros", "net"] }
http = { workspace = true }
clap = { version = "3.2.25", features = ["derive"] }
async-trait = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
prometheus = "0"
pingora-http = { version = "0.4.0", path = "../pingora-http" }
pingora-error = { version = "0.4.0", path = "../pingora-error" }
pingora-proxy = { version = "0.4.0", path = "../pingora-proxy" }
pingora-core = { version = "0.4.0", path = "../pingora-core", features = ["boringssl"] }
pingora-load-balancing = { version = "0.4.0", path = "../pingora-load-balancing"}
dotenv = "0.15"
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
log4rs = "1.3.0"
reqwest = { version = "0.11", features = [
    "rustls-tls",
], default-features = false }
